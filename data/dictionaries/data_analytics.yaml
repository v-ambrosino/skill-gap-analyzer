  - name: Data Cleaning
    category: Analytics & Statistics
    synonyms: [data cleaning, data cleansing, data wrangling, data preparation, data prep, pulizia dei dati, pulizia dati, preparazione dei dati, data munging, clean data]
    # "clean"/"cleaning"/"cleaned" followed within a few words by data/dataset(s),
