    synonyms: [ms excel, microsoft excel, excel avanzato, advanced excel, vlookup, xlookup, cerca.vert, index match, recherchev, sverweis, buscarv, procv]
    # "excel" is also an English verb ("excel at", "excel in"): exclude it.
    patterns: ['(?i)(?<![\w&])excel(?!\s+(?:at|in|as)\b)(?![\w&])']
