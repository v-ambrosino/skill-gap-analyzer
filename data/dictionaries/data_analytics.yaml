  # ---------------------------------------------------------------------------
  # Programming & Data: languages, databases, libraries
  # ---------------------------------------------------------------------------
  - name: SQL
    category: Programming & Data
    # "NoSQL"/"MySQL" do not match: "sql" must be a whole word.
    synonyms: [sql, t-sql, pl/sql, ansi sql, query sql, sql queries, sql query]
  - name: Python
    category: Programming & Data
    synonyms: [python, python3]
  - name: R
    category: Programming & Data
    synonyms: [r programming, r language, linguaggio r, rstudio, r studio, tidyverse, ggplot2, dplyr, r shiny]
    # Uppercase "R" as a standalone word, but NOT:
    #   - "R&D" (research and development)
    #   - an initial in a name, like "Mario R. Rossi" or "J.R."
    #   - "SAP R/3" or "R's"
    # The second pattern recovers "R" at the end of a sentence after
    # "and"/"or"/a comma/a slash ("... Python or R. We offer ...").
    patterns:
      - '(?<![\w&.''])R(?![\w&''/])(?!\.\s?[A-Z])'
      - '(?:(?<=and )|(?<=or )|(?<=, )|(?<=/))R(?=\.)'
