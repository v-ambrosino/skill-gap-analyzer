# =============================================================================
# Skill dictionary: Data Analyst, BI Analyst, Business Analyst
# =============================================================================
#
# Each entry describes ONE skill. Fields:
#
#   name        (required) Display name shown in the app.
#   category    (required) Must be one of the categories listed below.
#   synonyms    Phrases matched case-INSENSITIVELY as whole words.
#               Accents are ignored ("capacità" == "capacita"), spaces and
#               hyphens are interchangeable/optional ("power bi" also matches
#               "power-bi" and "powerbi") and a plural "s"/"es" is accepted for
#               phrases of 4+ characters.
#   case_sensitive_synonyms
#               Phrases matched as whole words with EXACT casing. Use them for
#               short or ambiguous names ("SAS" must not match the Italian
#               company type "Sas").
#   patterns    Raw Python regular expressions for the hardest cases
#               (e.g. the one-letter language "R"). They run on the normalised
#               text (accents removed, original casing kept). Add (?i) at the
#               start to make a pattern case-insensitive.
#
# Every skill needs at least one of synonyms / case_sensitive_synonyms /
# patterns. The skill name itself is NOT matched automatically, so tricky
# names like "R" are never matched by accident.
#
# To support another role or industry, copy this file into data/dictionaries/,
# change `domain`, `description`, `categories` and the skills: the app lists
# every dictionary in that folder automatically. Shared skills (e.g. soft
# skills) can be reused with `include`.
# =============================================================================

version: 1
domain: Data Analyst / BI / Business Analyst
description: Data Analyst, BI Analyst and Business Analyst roles

# Other files whose skills are added to this dictionary (paths are relative
# to this file).
include:
  - shared/soft_skills.yaml

categories:
  - Tools
  - Programming & Data
  - Analytics & Statistics
  - Methodologies
  - Business & Domain
  - Soft Skills

