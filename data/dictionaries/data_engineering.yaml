  # ---------------------------------------------------------------------------
  # Programming & Databases
  # ---------------------------------------------------------------------------
  - name: SQL
    category: Programming & Databases
    synonyms: [sql, t-sql, pl/sql, ansi sql, sql queries, sql query]
  - name: Python
    category: Programming & Databases
    synonyms: [python, python3]
  - name: Scala
    category: Programming & Databases
    # Lowercase "scala" is a common Italian word ("su larga scala").
    case_sensitive_synonyms: [Scala]
  - name: Java
    category: Programming & Databases
    case_sensitive_synonyms: [Java, JAVA]
  - name: Go
    category: Programming & Databases
    # Plain "go" is far too common: only unambiguous names.
    synonyms: [golang, go programming, go language, linguaggio go]
    # Capitalised "Go" inside a list or after a preposition: "Python, Go and Rust",
    # "(Go)", "Java/Go", "experience with Go.", "conoscenza di Go".
    patterns: ['(?:(?<=, )|(?<=and )|(?<=or )|(?<=\()|(?<=/)|(?<=with )|(?<=in )|(?<=di ))Go(?=[,.;)/]|\s+(?:and|or|e|o|is|are|would|will)\b|$)']
  - name: Bash / Shell
    category: Programming & Databases
    synonyms: [bash, shell scripting, shell scripts, unix shell, linux shell]
