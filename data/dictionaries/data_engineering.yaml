# =============================================================================
# Skill dictionary: Data Engineer, Analytics Engineer
# =============================================================================
#
# Same format as data_analytics.yaml (see the field reference at the top of
# that file). Soft skills come from shared/soft_skills.yaml via `include`.
# =============================================================================

version: 1
domain: Data Engineer / Analytics Engineer
description: Data Engineer and Analytics Engineer roles

include:
  - shared/soft_skills.yaml

categories:
  - Cloud & Platforms
  - Programming & Databases
  - Pipelines & Processing
  - Data Architecture
  - Engineering Practices
  - Soft Skills

