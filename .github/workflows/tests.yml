name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported version and the one Streamlit Community Cloud uses by default.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check the skill dictionary loads
        run: python -c "from skill_gap.skills_dictionary import load_dictionary; print(len(load_dictionary().skills), 'skills')"
      - name: Run tests
        run: pytest -q
