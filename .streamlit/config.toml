[server]
# CVs are small: a low limit also protects the free Community Cloud instance.
maxUploadSize = 5

[browser]
# Do not send usage statistics to Streamlit.
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2f6fe4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f6fb"
textColor = "#1f1f1e"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.75rem"
borderColor = "#e3e6ec"

[theme.sidebar]
backgroundColor = "#f7f9fc"
